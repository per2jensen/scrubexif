name: Manual Docker Release

on:
  workflow_dispatch:
    inputs:
      FINAL_VERSION:
        description: "Release version (for example 1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  security-events: write
  id-token: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCKERHUB_REPO: per2jensen/scrubexif
  FINAL_IMAGE_NAME: scrubexif
  UBUNTU_VERSION: "24.04"

concurrency:
  group: scrubexif-image-publication
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      FINAL_VERSION: ${{ inputs.FINAL_VERSION }}

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release request
        run: |
          set -euo pipefail

          if [[ ! "${FINAL_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: FINAL_VERSION must use stable X.Y.Z form" >&2
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "ERROR: Stable releases must run from refs/heads/main" >&2
            exit 1
          fi

          TAG_REF="refs/tags/v${FINAL_VERSION}"
          if ! git show-ref --verify --quiet "${TAG_REF}"; then
            echo "ERROR: Required release tag does not exist: v${FINAL_VERSION}" >&2
            exit 1
          fi

          SOURCE_COMMIT=$(git rev-parse "${TAG_REF}^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "${SOURCE_COMMIT}" != "${HEAD_COMMIT}" ]; then
            echo "ERROR: v${FINAL_VERSION} does not point to the checked-out main commit" >&2
            exit 1
          fi

          echo "SOURCE_GIT_REV=$(git rev-parse --short "${TAG_REF}^{commit}")" \
            >> "${GITHUB_ENV}"
          echo "SBOM_FILE=sbom-${FINAL_VERSION}.spdx.json" >> "${GITHUB_ENV}"
          echo "SARIF_FILE=grype-results-${FINAL_VERSION}.sarif" >> "${GITHUB_ENV}"

      - name: Load pinned security tool versions
        run: |
          set -euo pipefail
          python3 scripts/security_tool_versions.py export \
            --config .github/security-tools.json \
            --github-env "${GITHUB_ENV}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y exiftool libjpeg-turbo-progs
          python -m pip install --upgrade pip
          python -m pip install ".[test]" --break-system-packages

      - name: Run source tests
        run: |
          set -euo pipefail
          python3 --version
          exiftool -ver
          make dev-clean
          make test

      - name: Build release image from scratch
        run: |
          set -euo pipefail
          make \
            FINAL_VERSION="${FINAL_VERSION}" \
            DOCKER_BUILD_FLAGS="--pull --no-cache" \
            final

      - name: Test release image
        run: make FINAL_VERSION="${FINAL_VERSION}" test-release

      - name: Verify application version
        run: |
          set -euo pipefail
          make \
            FINAL_VERSION="${FINAL_VERSION}" \
            EXPECTED_CLI_VERSION="${FINAL_VERSION}" \
            verify-cli-version

      - name: Verify OCI labels
        run: make FINAL_VERSION="${FINAL_VERSION}" verify-labels

      - name: Install Syft and Grype
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          curl -sSfL \
            "https://raw.githubusercontent.com/anchore/grype/${GRYPE_VERSION}/install.sh" \
            | sh -s -- -b /usr/local/bin "${GRYPE_VERSION}"
          syft version
          grype version

      - uses: sigstore/cosign-installer@v3

      - name: Cache Grype database
        uses: actions/cache@v6
        with:
          path: ~/.cache/grype/db
          key: grype-db-${{ runner.os }}-${{ env.GRYPE_VERSION }}-${{ github.run_id }}
          restore-keys: |
            grype-db-${{ runner.os }}-${{ env.GRYPE_VERSION }}-

      - name: Generate SPDX SBOM
        run: |
          set -euo pipefail
          SYFT_CHECK_FOR_APP_UPDATE=false \
            syft "docker:${FINAL_IMAGE_NAME}:${FINAL_VERSION}" \
              -o spdx-json \
              > "${SBOM_FILE}"
          test -s "${SBOM_FILE}"

      - name: Scan SBOM with Grype
        id: grype_scan
        run: |
          set -euo pipefail
          GRYPE_CHECK_FOR_APP_UPDATE=false \
            grype \
              "sbom:${SBOM_FILE}" \
              --fail-on high \
              -o sarif \
              > "${SARIF_FILE}"
          test -s "${SARIF_FILE}"

      - name: Upload Grype SARIF to GitHub Security
        if: always() && steps.grype_scan.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: ${{ env.SARIF_FILE }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release audit artifacts
        if: always() && steps.grype_scan.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: release-audit-${{ env.FINAL_VERSION }}
          path: |
            ${{ env.SBOM_FILE }}
            ${{ env.SARIF_FILE }}

      - name: Log in to Docker Hub
        run: |
          set -euo pipefail
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login \
                -u "${{ secrets.DOCKERHUB_USER_NAME }}" \
                --password-stdin

      - name: Refuse to overwrite an existing release tag
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER_NAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/dockerhub_manifest.py assert-absent \
            --repo "${DOCKERHUB_REPO}" \
            --tag "${FINAL_VERSION}"

      - name: Push immutable release tag
        id: push_release
        run: docker push "${DOCKERHUB_REPO}:${FINAL_VERSION}"

      - name: Capture immutable image digest
        id: image_digest
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER_NAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/dockerhub_manifest.py resolve \
            --repo "${DOCKERHUB_REPO}" \
            --tag "${FINAL_VERSION}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Roll back immutable tag if digest capture fails
        if: >
          failure() &&
          steps.push_release.outcome == 'success' &&
          steps.image_digest.outcome == 'failure'
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER_NAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/remove_dockerhub_tag.py \
            --repo "${DOCKERHUB_REPO}" \
            --tag "${FINAL_VERSION}"

      - name: Sign image digest with cosign
        id: cosign_sign
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          OUTPUT=$(cosign sign --yes \
            "${{ steps.image_digest.outputs.digest }}" 2>&1)
          echo "${OUTPUT}"

          REKOR_INDEX=$(echo "${OUTPUT}" \
            | grep -oP 'tlog entry created with index: \K[0-9]+' || true)
          if [ -n "${REKOR_INDEX}" ]; then
            REKOR_URL="https://search.sigstore.dev/?logIndex=${REKOR_INDEX}"
          else
            REKOR_URL=""
          fi
          echo "rekor_url=${REKOR_URL}" >> "${GITHUB_OUTPUT}"
          echo "rekor_index=${REKOR_INDEX}" >> "${GITHUB_OUTPUT}"

      - name: Attach signed SBOM attestation
        id: cosign_attest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign attest --yes \
            --predicate "${SBOM_FILE}" \
            --type spdxjson \
            "${{ steps.image_digest.outputs.digest }}"

      - name: Write signing failure badge
        if: >
          failure() && (
            steps.cosign_sign.outcome == 'failure' ||
            steps.cosign_attest.outcome == 'failure'
          )
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          python3 scripts/write_cosign_badge.py --failed
          git add doc/cosign_badge.json
          if ! git diff --cached --quiet; then
            git commit -m "cosign badge: signing failed for ${FINAL_VERSION}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Roll back immutable tag after trust failure
        if: >
          failure() && (
            steps.cosign_sign.outcome == 'failure' ||
            steps.cosign_attest.outcome == 'failure'
          )
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER_NAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/remove_dockerhub_tag.py \
            --repo "${DOCKERHUB_REPO}" \
            --tag "${FINAL_VERSION}"

      - name: Record audited immutable release
        id: audit_commit
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull --rebase origin main

          make FINAL_VERSION="${FINAL_VERSION}" update-details-version
          make FINAL_VERSION="${FINAL_VERSION}" update-readme-version
          make FINAL_VERSION="${FINAL_VERSION}" update-index-html-version

          export BUILD_RUNNER="${{ runner.os }}-${{ runner.arch }}"
          export BUILD_GIT_REV="${SOURCE_GIT_REV}"
          export PUSHED_IMAGE_DIGEST="${{ steps.image_digest.outputs.digest }}"
          export COSIGN_SIGNED="true"
          export COSIGN_REKOR_URL="${{ steps.cosign_sign.outputs.rekor_url }}"
          export COSIGN_IMAGE_DIGEST="${{ steps.image_digest.outputs.digest }}"
          export SBOM_RELEASE_ASSET_URL="https://github.com/${{ github.repository }}/releases/download/v${FINAL_VERSION}/${SBOM_FILE}"
          make FINAL_VERSION="${FINAL_VERSION}" log-build-json

          python3 scripts/write_cosign_badge.py
          python3 clonepulse/add_release_annotation.py "${FINAL_VERSION}"

          git add \
            doc/DETAILS.md \
            README.md \
            index.html \
            doc/build-history.json \
            doc/cosign_badge.json \
            clonepulse/fetch_clones.json
          if git diff --cached --quiet; then
            echo "ERROR: Release audit metadata produced no changes" >&2
            exit 1
          fi

          git commit -m "release ${FINAL_VERSION}: documentation and audit metadata"
          git push origin HEAD:main

      - name: Roll back immutable tag if audit persistence fails
        if: >
          failure() &&
          steps.audit_commit.outcome == 'failure'
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER_NAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/remove_dockerhub_tag.py \
            --repo "${DOCKERHUB_REPO}" \
            --tag "${FINAL_VERSION}"

      - name: Create GitHub Release with audit assets
        id: github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FINAL_VERSION }}
          name: Scrubexif Release v${{ env.FINAL_VERSION }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            ## Documentation

            - [What's changed](https://github.com/${{ github.repository }}/blob/main/Changelog.md)
            - [Full documentation](https://github.com/${{ github.repository }}/blob/main/doc/DETAILS.md)
            - [Filename rename spec](https://github.com/${{ github.repository }}/blob/main/doc/rename-spec.md)
            - [Project page](https://per2jensen.github.io/scrubexif/)

            ## Supply chain

            | Artifact | Link |
            |---|---|
            | SPDX SBOM | attached as release asset |
            | Grype vulnerability scan | attached as release asset and uploaded to GitHub Security |
            | Rekor transparency log | ${{ steps.cosign_sign.outputs.rekor_url }} |
            | Syft | `${{ env.SYFT_VERSION }}` |
            | Grype | `${{ env.GRYPE_VERSION }}` |

            ## Verify the image signature

            ```bash
            cosign verify per2jensen/scrubexif:${{ env.FINAL_VERSION }} \
              --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
            ```
          files: |
            ${{ env.SBOM_FILE }}
            ${{ env.SARIF_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish audited release as latest
        id: push_latest
        run: |
          set -euo pipefail
          docker tag \
            "${DOCKERHUB_REPO}:${FINAL_VERSION}" \
            "${DOCKERHUB_REPO}:latest"
          docker push "${DOCKERHUB_REPO}:latest"

      - name: Trigger Docker Hub README update
        run: |
          set -euo pipefail
          gh workflow run dockerhub-readme.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post release summary
        run: |
          set -euo pipefail
          SUMMARY=$(python3 scripts/grype_sarif_summary.py "${SARIF_FILE}")
          CRITICAL=$(jq -r '.counts.critical // 0' <<< "${SUMMARY}")
          HIGH=$(jq -r '.counts.high // 0' <<< "${SUMMARY}")
          MEDIUM=$(jq -r '.counts.medium // 0' <<< "${SUMMARY}")

          echo "## Scrubexif release v${FINAL_VERSION}" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Field | Value |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|---|---|" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Immutable image | \`${DOCKERHUB_REPO}:${FINAL_VERSION}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Also published as | \`${DOCKERHUB_REPO}:latest\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Image digest | \`${{ steps.image_digest.outputs.digest }}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Rekor entry | ${{ steps.cosign_sign.outputs.rekor_url }} |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Syft / Grype | \`${SYFT_VERSION}\` / \`${GRYPE_VERSION}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Grype Critical / High / Medium | ${CRITICAL} / ${HIGH} / ${MEDIUM} |" >> "${GITHUB_STEP_SUMMARY}"
